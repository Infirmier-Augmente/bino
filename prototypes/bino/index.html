<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bino · le binôme des infirmiers</title>
<meta name="description" content="Bino : dictée structurée en transmissions DAR, relève et NEWS2. Démo hackathon IA santé, données fictives.">
<meta name="theme-color" content="#FF0066">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/bino/salue-bust.png" type="image/png">
<link rel="apple-touch-icon" href="assets/bino/salue-bust.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bino">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="app"><p class="sub">Chargement…</p></main>
  <div class="shift-dock" id="shift" hidden>
    <button type="button" class="shift-btn" data-act="askShift">
      <span>Transmettre</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
</div>
<div id="sheet"></div>
<div id="done"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Bino a besoin de JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
