name: Évaluation LLM réelle

# Lancement manuel (onglet Actions) pour comparer prompts / fournisseurs sur les scénarios.
# Clés à mettre dans Settings → Secrets and variables → Actions (jamais dans le code).
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM_PROVIDER (deepseek, openai, mistral, anthropic, google, groq, openai-compatible)"
        default: deepseek
      model:
        description: "LLM_MODEL (vide = défaut du fournisseur)"
        default: ""
      classifier:
        description: "CLASSIFIER_PROVIDER (heuristic, llm, jev)"
        default: heuristic

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Évaluation
        env:
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_MODEL: ${{ inputs.model }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          CLASSIFIER_PROVIDER: ${{ inputs.classifier }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: pnpm sim eval --json > eval.json && pnpm sim eval
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: eval.json
