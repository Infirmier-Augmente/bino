name: Deploy prototype

# Un push sur proto publie prototypes/bino sur le Worker Cloudflare.
on:
  push:
    branches: [proto]

concurrency:
  group: deploy-prototype
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="${missing:+$missing }CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "Secrets manquants sur le dépôt : $missing"
            exit 1
          fi
      - name: Déployer le prototype
        working-directory: prototypes/bino
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      # Facultatif : clé IA et code de remise à zéro, copiés des secrets GitHub vers les secrets
      # du Worker (jamais dans le code). Sans ANTHROPIC_API_KEY, l'app tourne en règles locales.
      - name: Secrets du Worker (IA, remise à zéro)
        working-directory: prototypes/bino
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESET_CODE: ${{ secrets.BINO_RESET_CODE }}
          API_EDGE_SECRET: ${{ secrets.API_EDGE_SECRET }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY
          else
            echo "ANTHROPIC_API_KEY absent : l'IA reste désactivée (règles locales)."
          fi
          if [ -n "$RESET_CODE" ]; then
            printf '%s' "$RESET_CODE" | npx --yes wrangler@4 secret put RESET_CODE
          fi
          if [ -n "$API_EDGE_SECRET" ]; then
            printf '%s' "$API_EDGE_SECRET" | npx --yes wrangler@4 secret put API_EDGE_SECRET
          else
            echo "API_EDGE_SECRET absent : le site ne peut pas appeler le mini."
            exit 1
          fi
