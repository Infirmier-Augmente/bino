name: Deploy prototype

# Un push sur feat/bino-prototype publie prototypes/bino sur le Worker Cloudflare.
on:
  push:
    branches: [feat/bino-prototype]

concurrency:
  group: deploy-prototype
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="${missing:+$missing }CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "Secrets manquants sur le dépôt : $missing"
            exit 1
          fi
      - name: Déployer le prototype
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: prototypes/bino
          packageManager: npm
          wranglerVersion: "4"
