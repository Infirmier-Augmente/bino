# Hooks git partagés par toute l'équipe (installés automatiquement par `pnpm install`).
# Objectif : ne jamais pousser du code qui casse la CI.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    secrets:
      run: node scripts/check-secrets.mjs {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    check:
      run: pnpm typecheck && pnpm test
